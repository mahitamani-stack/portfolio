        /* Book wrapper for drop-shadow (matches alpha transparency contour) */
        .diary-book-container {

        /* Individual page styling - MAKE TRANSPARENT and ALLOW OVERFLOW */

            overflow: visible !important;
            position: relative;

        .page-img {

        /* Cover Sizing & Wobble styling to prevent cropping on the left */
        .my-page.cover-page .page-img {

        }

        /* Closed cover wobbling micro-animation */
        @keyframes gentle-wobble {
            0% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(0.6deg) translateY(-2px); }
            50% { transform: rotate(-0.5deg) translateY(1px); }
            75% { transform: rotate(0.4deg) translateY(-1px); }
            100% { transform: rotate(0deg) translateY(0); }
        }
        
        .wobble-cover {
            animation: gentle-wobble 4.5s ease-in-out infinite;
            transform-origin: bottom center;
            transition: transform 0.3s ease;
        }

        .wobble-cover:hover {
            animation-play-state: paused;
            transform: scale(1.02); /* slight click response pop */
        }

        /* Prevent stretching by explicitly positioning asymmetric pages relative to the spine */
        .my-page.left-page .page-img {
            position: absolute;
            right: 0;
            top: 0;
        }

        /* ── Orientation-aware mobile diary: portrait "camera pan" filmstrip,
           landscape full-screen page-flip. Driven by data-diary-mode, set in JS
           (a raw width media query can't tell portrait vs landscape apart when a
           phone's landscape width exceeds 767px). ── */
        .diary-filmstrip-container {
            display: none;
            position: relative;
            overflow: hidden;
            border-radius: 0px !important;
            order: 1;
            filter: drop-shadow(0 25px 55px rgba(0, 0, 0, 0.22));
            width: 100% !important;
            max-width: 100vw !important;
            margin: 0 !important;
            aspect-ratio: 2260 / 3250 !important;
        }

        .diary-filmstrip-page {
            width: 100vw !important;
            height: 100% !important;
            flex-shrink: 0 !important;
            display: block !important;
            object-fit: cover !important;
        }

        /* Page 1: centered & contain */
        .diary-filmstrip-page:nth-child(1) {
            object-fit: contain !important;
            margin: 0 auto !important;
        }
        /* Pages 2, 4, 6: source photos have a thin white margin baked in on the
           left (their aspect ratio is narrower than the filmstrip's, so cover
           only crops vertically and that margin would otherwise show as a gap).
           A small extra zoom, anchored to the right edge, crops it away so the
           page reads as flush-right with no padding. Scale values are measured
           per-image from the actual white-margin width in diary_assets. */
        .diary-filmstrip-page:nth-child(2) {
            object-position: right center !important;
            transform: scale(1.05);
            transform-origin: right center;
        }
        .diary-filmstrip-page:nth-child(4),
        .diary-filmstrip-page:nth-child(6) {
            object-position: right center !important;
            transform: scale(1.015);
            transform-origin: right center;
        }
        /* Pages 3, 5, 7: much wider than the filmstrip, so cover already crops
           heavily on the width. Anchor to the left edge so the crop only
           bleeds off the right side. */
        .diary-filmstrip-page:nth-child(3),
        .diary-filmstrip-page:nth-child(5),
        .diary-filmstrip-page:nth-child(7) {
            object-position: left center !important;
        }

        .diary-wrapper[data-diary-mode="portrait"] {
            flex-direction: column;
        }

        .diary-wrapper[data-diary-mode="portrait"] .diary-filmstrip-container {
            display: block;
        }

        .diary-wrapper[data-diary-mode="portrait"] .diary-book-container {
            display: none;
        }

        .diary-filmstrip-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .diary-filmstrip-page {
            -webkit-user-drag: none;
            user-select: none;
        }


        /* Landscape mobile: the book fills the screen, nav arrows float over its edges.
           Sized to content (not a forced 100vh) — the navbar sits above this section,
           so forcing 100vh here would push the total page past one viewport and force
           a scroll; the JS sizing already accounts for the navbar's real height. */
        .diary-main-section[data-diary-fullscreen="true"] {
            padding: 0.5rem 0px !important;
            min-height: 100vh !important;
            height: auto !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            box-sizing: border-box !important;
        }

        .diary-wrapper[data-diary-mode="landscape"] {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 0 !important;
            margin: 0 auto !important;
            width: 100% !important;
            max-width: 100vw !important;
        }

        .diary-nav-btn.diary-nav-overlay {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
            background-color: rgba(254, 255, 221, 0.85);
        }

        .diary-nav-btn.diary-nav-overlay.prev-btn {
            left: 0.5rem;
        }

        .diary-nav-btn.diary-nav-overlay.next-btn {
            right: 0.5rem;
        }

        /* The iPod widget's default minimized position (bottom-right) sits
           right in the vertical-center strip where the landscape diary's
           overlaid right arrow lives. Tuck it into the top-right corner
           instead while the diary is in full-screen landscape mode. */
        @media (max-width: 991px) and (orientation: landscape) {
            body:has(.diary-wrapper[data-diary-mode="landscape"]) .ipod-widget-container.minimized {
                bottom: 1.25rem !important;
                left: 0.5rem !important;
                right: auto !important;
                top: auto !important;
                height: 80px !important;
            }
            body:has(.diary-wrapper[data-diary-mode="landscape"]) .ipod-widget-container:not(.minimized) {
                height: 420px !important;
            }
        }

        @media (max-width: 991px) and (orientation: landscape) {
            .diary-main-section {
                padding: 0.5rem 0px !important;
            }
            /* Belt-and-suspenders on top of the JS-side sizing fix: StPageFlip
               sets an inline min-width/min-height on #diary-book at construction
               time that (in "stretch" mode) can win out over the smaller size we
               actually want on a short mobile-landscape screen, pushing the book
               wider/taller than its container and off-center to the bottom-right.
               Force it back down to the container's own box no matter what the
               library computes. */
            #diary-book {
                min-width: 0 !important;
                min-height: 0 !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }
            .diary-book-container {
                max-width: 100%;
                max-height: 100%;
            }
        }

        .diary-book-container.cover-state {
            transform: translateX(-25%) !important;
        }
    </style>

    <!-- ── StPageFlip JS Initialization ── -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bookElement = document.getElementById("diary-book");
            const container = document.querySelector('.diary-book-container');
            const prevBtn = document.getElementById("diary-prev-btn");
            const nextBtn = document.getElementById("diary-next-btn");
            const wrapper = document.querySelector('.diary-wrapper');
            const mainSection = document.querySelector('.diary-main-section');
            const filmstripContainer = document.getElementById('diary-filmstrip-container');
            const filmstripTrack = document.getElementById('diary-filmstrip-track');

            if (!bookElement || !container) return;

            // Stable mobile-device check — deliberately does NOT change when the
            // phone rotates (unlike a pure viewport-width media query, which
            // would flip in/out as portrait/landscape width swap around 767px).
            const ua = navigator.userAgent || '';
            const isMobileUA = /iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            const isMobileDevice = isMobileUA || Math.min(window.innerWidth, window.innerHeight) <= 767;

            const getMode = () => {
                if (!isMobileDevice) return 'desktop';
                return window.matchMedia('(orientation: landscape)').matches ? 'landscape' : 'portrait';
            };

            let currentMode = null;

            // ── Portrait "camera pan" filmstrip ──
            let filmstripIndex = 0;
            const filmstripPages = filmstripTrack ? Array.from(filmstripTrack.children) : [];

            const updateFilmstripButtons = () => {
                prevBtn.classList.toggle("disabled", filmstripIndex === 0);
                nextBtn.classList.toggle("disabled", filmstripIndex >= filmstripPages.length - 1);
            };

            const renderFilmstrip = () => {
                if (!filmstripPages.length) return;
                let offset = 0;
                for (let i = 0; i < filmstripIndex; i++) offset += filmstripPages[i].offsetWidth;
                filmstripTrack.style.transform = `translateX(-${offset}px)`;
                updateFilmstripButtons();
            };

            const filmstripPrev = () => { if (filmstripIndex > 0) { filmstripIndex--; renderFilmstrip(); } };
            const filmstripNext = () => { if (filmstripIndex < filmstripPages.length - 1) { filmstripIndex++; renderFilmstrip(); } };

            // Page width isn't known until each image loads; re-measure once it does.
            filmstripPages.forEach((img) => {
                img.addEventListener('load', () => { if (currentMode === 'portrait') renderFilmstrip(); });
            });

            // Handle mobile arrows placement — differs per mode: stacked below the
            // filmstrip on portrait, floating over the book's edges on landscape
            // (to keep the book itself screen-filling), beside the book on desktop.
            const setupArrowsLayout = (mode) => {
                prevBtn.remove();
                nextBtn.remove();
                prevBtn.classList.remove('diary-nav-overlay');
                nextBtn.classList.remove('diary-nav-overlay');
                const existingRow = document.querySelector('.mobile-arrows-row');
                if (existingRow) existingRow.remove();

                if (mode === 'portrait') {
                    const arrowsRow = document.createElement('div');
                    arrowsRow.className = 'mobile-arrows-row';
                    arrowsRow.appendChild(prevBtn);
                    arrowsRow.appendChild(nextBtn);
                    wrapper.appendChild(arrowsRow);
                } else if (mode === 'landscape') {
                    prevBtn.classList.add('diary-nav-overlay');
                    nextBtn.classList.add('diary-nav-overlay');
                    wrapper.insertBefore(prevBtn, container);
                    wrapper.appendChild(nextBtn);
                } else {
                    wrapper.insertBefore(prevBtn, container);
                    wrapper.appendChild(nextBtn);
                }
            };

            // Calculate base page size responsively. Desktop: maximize page width
            // while fitting vertical space (unchanged from before). Mobile
            // landscape: fill the (short) viewport height first so the book is
            // screen-filling, since a short landscape phone breaks the
            // width-led math desktop uses.
            const getPageDimensions = (mode) => {
                const vw = window.innerWidth;
                const vh = window.innerHeight;

                if (mode === 'landscape') {
                    // Account for the navbar above this section and the section's
                    // own padding — otherwise the book computes to a height that,
                    // stacked below the navbar, is taller than the viewport and
                    // forces a scroll instead of truly filling the screen.
                    const navEl = document.querySelector('.navbar-1');
                    const navHeight = navEl ? navEl.getBoundingClientRect().height : 0;
                    const sectionPadding = 16; // 0.5rem top + bottom in fullscreen mode
                    const margin = 16;
                    const availableHeight = vh - navHeight - sectionPadding - margin;
                    let height = Math.max(availableHeight * 0.96, 180);
                    let width = Math.round(height * (2150 / 3250));
                    if (width * 2 > vw - margin) {
                        width = Math.floor((vw - margin) / 2);
                        height = Math.round(width * (3250 / 2150));
                    }
                    return { width, height };
                }

                const looseMaxHeight = vh * 1.35;
                let width = 360;

                if (vw > 1200) {
                    width = Math.min(vw * 0.48, 950);
                } else if (vw > 991) {
                    width = Math.min(vw * 0.47, 950);
                } else if (vw > 767) {
                    width = Math.min(vw * 0.46, 950);
                } else {
                    width = Math.min(vw - 40, 420);
                }

                let height = Math.round(width * (3250 / 2150));

                if (vw > 767 && height > looseMaxHeight) {
                    height = Math.round(looseMaxHeight);
                    width = Math.round(height * (2150 / 3250));
                }

                return { width, height };
            };

            // Initial best-effort size (corrected by applyMode right after init)
            const initialDims = getPageDimensions(isMobileDevice ? 'landscape' : 'desktop');
            container.style.width = `${initialDims.width * 2}px`;
            container.style.height = `${initialDims.height}px`;

            bookElement.style.display = "block";

            const pageFlip = new St.PageFlip(bookElement, {
                width: initialDims.width,
                height: initialDims.height,
                size: "stretch",
                // minWidth/minHeight were 240/330 — taller and wider than a short
                // mobile-landscape viewport can fit (nav + margins already eat
                // ~100px of a ~390px-tall screen). getPageDimensions() computes a
                // smaller size to fit that screen, but StPageFlip's "stretch" mode
                // was clamping back up to these floors, forcing the book to
                // overflow past the bottom/sides of the screen. 100/180 match the
                // floor getPageDimensions() itself uses for landscape mode, so
                // they're a no-op on desktop where the width-led math always
                // computes well above this anyway.
                minWidth: 100,
                maxWidth: 950,
                minHeight: 180,
                maxHeight: 1300,
                drawShadow: true,
                showCover: true,
                usePortrait: false, // Safety net for narrow desktop windows
                flippingTime: 750,
                maxShadowOpacity: 0.22,
                startPage: 0
            });

            pageFlip.loadFromHTML(document.querySelectorAll(".my-page"));

            const updateCoverState = () => {
                container.classList.toggle("cover-state", pageFlip.getCurrentPageIndex() === 0);
            };

            const updateButtons = () => {
                const currentPage = pageFlip.getCurrentPageIndex();
                const pageCount = pageFlip.getPageCount();
                prevBtn.classList.toggle("disabled", currentPage === 0);
                nextBtn.classList.toggle("disabled", currentPage >= pageCount - 1);
            };

            // Applies the current orientation-driven mode: which viewer is
            // visible, where the arrows live, and (for desktop/landscape)
            // resizes St.PageFlip. Portrait skips PageFlip entirely since its
            // container is hidden — resizing a hidden canvas isn't meaningful.
            const applyMode = (mode) => {
                currentMode = mode;
                wrapper.dataset.diaryMode = mode;
                mainSection.dataset.diaryFullscreen = mode === 'landscape' ? 'true' : 'false';
                setupArrowsLayout(mode);

                if (mode === 'portrait') {
                    renderFilmstrip();
                    return;
                }

                const dims = getPageDimensions(mode);
                container.style.width = `${dims.width * 2}px`;
                container.style.height = `${dims.height}px`;
                pageFlip.update({ width: dims.width, height: dims.height });
                updateCoverState();
                updateButtons();
            };

            applyMode(getMode());
            setTimeout(() => applyMode(getMode()), 200); // safety re-check, mirrors old post-init delay

            prevBtn.addEventListener("click", () => {
                if (currentMode === 'portrait') filmstripPrev();
                else pageFlip.flipPrev();
            });
            nextBtn.addEventListener("click", () => {
                if (currentMode === 'portrait') filmstripNext();
                else pageFlip.flipNext();
            });

            pageFlip.on("flip", () => {
                if (currentMode === 'portrait') return;
                updateCoverState();
                updateButtons();
            });

            pageFlip.on("changeState", (e) => {
                if (e.data === "read" && currentMode !== 'portrait') {
                    updateCoverState();
                    updateButtons();
                }
            });

            window.addEventListener("resize", () => applyMode(getMode()));

            // Belt-and-suspenders: some mobile WebKit versions fire resize
            // unreliably on rotation, so also listen for the orientation
            // media query directly.
            if (window.matchMedia) {
                const orientationMql = window.matchMedia('(orientation: landscape)');
                const onOrientationChange = () => applyMode(getMode());
                if (orientationMql.addEventListener) orientationMql.addEventListener('change', onOrientationChange);
                else if (orientationMql.addListener) orientationMql.addListener(onOrientationChange);
            }
        });
    </script>
