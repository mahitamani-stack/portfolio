        /* Book wrapper for drop-shadow (matches alpha transparency contour) */
        .diary-book-container {
            position: relative;

        /* Center the closed cover page on desktop (shift by 25% of double-width) */

        }

        /* Individual page styling - MAKE TRANSPARENT and ALLOW OVERFLOW */
        .my-page {
            width: 100%;
            height: 100%;
            background-color: transparent !important;
            overflow: visible !important;
            position: relative;
        }

        .page-img {
            height: 100%;
            width: auto !important;
            max-width: none !important;
            display: block;
            pointer-events: none; /* allows page-flip drag/clicks to pass through */
        }

        /* Cover Sizing & Wobble styling to prevent cropping on the left */
        .my-page.cover-page .page-img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }

        /* Closed cover wobbling micro-animation */
        @keyframes gentle-wobble {
            0% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(0.6deg) translateY(-2px); }
            50% { transform: rotate(-0.5deg) translateY(1px); }
            75% { transform: rotate(0.4deg) translateY(-1px); }
            100% { transform: rotate(0deg) translateY(0); }
        }
        
        .wobble-cover {
            animation: gentle-wobble 4.5s ease-in-out infinite;
            transform-origin: bottom center;
            transition: transform 0.3s ease;
        }

        .wobble-cover:hover {
            animation-play-state: paused;
            transform: scale(1.02); /* slight click response pop */
        }

        /* Prevent stretching by explicitly positioning asymmetric pages relative to the spine */
        .my-page.left-page .page-img {
            position: absolute;
            right: 0;
            top: 0;
        }

        .my-page.right-page .page-img {
            position: absolute;
            left: 0;
            top: 0;
        }

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const bookElement = document.getElementById("diary-book");
            const container = document.querySelector('.diary-book-container');
            const prevBtn = document.getElementById("diary-prev-btn");
            const nextBtn = document.getElementById("diary-next-btn");

            if (!bookElement || !container) return;

            // Handle mobile arrows placement
            const setupArrowsLayout = () => {
                const isMobile = window.innerWidth <= 767;
                const wrapper = document.querySelector('.diary-wrapper');
                
                // Remove arrows first
                prevBtn.remove();
                nextBtn.remove();

                if (isMobile) {
                    // Create wrapper row at bottom for arrows
                    let arrowsRow = document.querySelector('.mobile-arrows-row');
                    if (!arrowsRow) {
                        arrowsRow = document.createElement('div');
                        arrowsRow.className = 'mobile-arrows-row';
                    }
                    arrowsRow.appendChild(prevBtn);
                    arrowsRow.appendChild(nextBtn);
                    wrapper.appendChild(arrowsRow);
                } else {
                    // Place them left and right of the book
                    wrapper.insertBefore(prevBtn, container);
                    wrapper.appendChild(nextBtn);
                    
                    const arrowsRow = document.querySelector('.mobile-arrows-row');
                    if (arrowsRow) arrowsRow.remove();
                }
            };

            // Calculate base page size (left page size 2150px) responsively
            const getPageDimensions = () => {
                const vw = window.innerWidth;
                let width = 360;
                
                if (vw > 1200) {
                    width = 460; // base single page width. open diary double-width is 920px
                } else if (vw > 991) {
                    width = 400; // 800px wide
                } else if (vw > 767) {
                    width = 330; // 660px wide
                } else {
                    // Portrait single-page on mobile
                    width = Math.min(vw - 40, 420);
                }

                // Aspect ratio of cropped left page is exactly 2150:3250
                const height = Math.round(width * (3250 / 2150));
                return { width, height };
            };

            const dimensions = getPageDimensions();

            // Set size on container before initialization
            const totalWidth = window.innerWidth > 767 ? dimensions.width * 2 : dimensions.width;
            container.style.width = `${totalWidth}px`;
            container.style.height = `${dimensions.height}px`;

            // Make book visible
            bookElement.style.display = "block";

            // Initialize PageFlip
            const pageFlip = new St.PageFlip(bookElement, {
                width: dimensions.width,
                height: dimensions.height,
                size: "stretch",
                minWidth: 240,
                maxWidth: 600,
                minHeight: 330,
                maxHeight: 825,
                drawShadow: true,
                showCover: true,
                usePortrait: true, // Swaps to single page automatically on small screens
                flippingTime: 750,
                maxShadowOpacity: 0.22,
                startPage: 0
            });

            // Load HTML elements as pages
            pageFlip.loadFromHTML(document.querySelectorAll(".my-page"));

            // Setup layout
            setupArrowsLayout();

            // Dynamic Cover Centering and Arrow updates
            const updateCoverState = () => {
                const currentPage = pageFlip.getCurrentPageIndex();
                if (currentPage === 0) {
                    container.classList.add("cover-state");
                } else {
                    container.classList.remove("cover-state");
                }
            };

            const updateButtons = () => {
                const currentPage = pageFlip.getCurrentPageIndex();
                const pageCount = pageFlip.getPageCount();
                
                if (currentPage === 0) {
                    prevBtn.classList.add("disabled");
                } else {
                    prevBtn.classList.remove("disabled");
                }

                if (currentPage >= pageCount - 1) {
                    nextBtn.classList.add("disabled");
                } else {
                    nextBtn.classList.remove("disabled");
                }
            };

            // Initial Trigger
            updateCoverState();
            setTimeout(updateButtons, 200);

            // Event Listeners for Arrows
            prevBtn.addEventListener("click", () => pageFlip.flipPrev());
            nextBtn.addEventListener("click", () => pageFlip.flipNext());

            pageFlip.on("flip", () => {
                updateCoverState();
                updateButtons();
            });

            pageFlip.on("changeState", (e) => {
                if (e.data === "read") {
                    updateCoverState();
                    updateButtons();
                }
            });

            // Adjust on window resize
            window.addEventListener("resize", () => {
                setupArrowsLayout();
                const dims = getPageDimensions();
                const currentTotalWidth = window.innerWidth > 767 ? dims.width * 2 : dims.width;
                container.style.width = `${currentTotalWidth}px`;
                container.style.height = `${dims.height}px`;
                
                // Update size on pageFlip
                pageFlip.update({
                    width: dims.width,
                    height: dims.height
                });
                updateCoverState();
            });
        });
    </script>
</body>
</html>
