  .sprite-3d-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 1rem;
    flex: 1;
    width: 100%;
    overflow: visible;
  }
  .sprite-3d-letter {
    position: relative;
    flex: 1;
    min-width: 5rem;
    padding: 0 0.5rem;
    text-align: center;
    cursor: pointer;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: visible;
  }
  .sprite-3d-text {
    font-size: 15vw;
    line-height: 1;
    font-family: var(--font-body) !important;
    transition: opacity 0.3s ease;
    color: #000;
    z-index: 2;
  }
  .sprite-3d-model {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 150%;
    height: 150%;
    transform: translate(-50%, -50%) translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    transform-style: preserve-3d;
    z-index: 1;
  }
  .sprite-3d-letter:hover .sprite-3d-text { opacity: 0; }
  .sprite-3d-letter:hover .sprite-3d-model {
    opacity: 1;
    transform: translate(-50%, -50%) translateY(-30px) rotateX(18deg) rotateY(12deg);
  }
  .sprite-3d-letter:nth-child(4) .sprite-3d-model,
  .sprite-3d-letter:nth-child(6) .sprite-3d-model {
    transform: translate(-50%, -50%) translateY(20px) scale(0.8);
  }
  .sprite-3d-letter:nth-child(4):hover .sprite-3d-model,
  .sprite-3d-letter:nth-child(6):hover .sprite-3d-model {
    transform: translate(-50%, -50%) translateY(-30px) rotateX(18deg) rotateY(12deg) scale(0.8);
  }
  .sm-wrapper { display: flex !important; flex-direction: column !important; position: relative !important; inset: auto !important; justify-content: center !important; align-items: flex-end !important; padding: 0 1.5rem 0 0 !important; gap: 1rem !important; width: auto !important; margin: 0 !important; }
  .sm-icon { width: 28px; height: 28px; filter: brightness(0); }
  .sm-icon-wrapper { display: flex; align-items: center; }

  @media (max-width: 900px) {
    .sprite-3d-model { width: 50px; height: 50px; }
    .sprite-3d-text { font-size: 2.5rem; }
  }

  /* ── Reading Accessibility & Typography Hierarchy Overrides ── */
  h1, .display-header, .h1 {
